---
#------------------------------------------------------------------------------
# Did You Know? of the day.
#
# Posts the fact of the day, from @smarter/didyouknow (smarter-sh/smarter-console's
# packages/smarter-didyouknow), to The Smarter Project's
# #general Slack channel, once a day. It is the same fact that the web
# console's Did you know? widget and smarter.sh show that day: the fact
# changes at midnight UTC, so the time of the run doesn't change which one.
#
# - smarter-sh/smarter-console, the web console's repository, is checked out
#   into console/. Its npm run slack:fact
#   bundles the package's scripts/slack-fact-of-the-day.ts from source with
#   esbuild and prints the message; this repository's scripts/slack_post.py
#   posts it.
# - Runs use the facts on smarter-console's default branch (main). By hand, it can
#   print the message without posting it (dry-run).
# - GitHub can start a scheduled run late, at busy times by an hour or more.
#
# Secrets:
#   SLACK_BOT_TOKEN   the Smarter Slack app's bot token. It needs the scope
#                     chat:write.public, or the bot must be a member of
#                     #general. Without it, nothing is posted.
#------------------------------------------------------------------------------
name: Slack Post - Did You Know

on:
  schedule:
    - cron: "7 14 * * *" # daily, 14:07 UTC
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Print the message on the run's page instead of posting it."
        required: false
        type: boolean
        default: false

concurrency:
  group: did-you-know
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout smarter-console
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: smarter-sh/smarter-console
          path: console
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: npm ci
        working-directory: console
        run: npm ci --include=dev

      - name: Post the fact of the day to Slack
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: general
          DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
        run: |
          set -o pipefail
          npm run --silent --prefix console/packages/smarter-didyouknow slack:fact \
            | python3 -I scripts/slack_post.py --channel "$SLACK_CHANNEL" ${DRY_RUN:+"$DRY_RUN"}
