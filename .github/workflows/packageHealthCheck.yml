---
#------------------------------------------------------------------------------
# Published Package Health Check.
#
# Every Wednesday night Central time, discovers published npm packages, PyPI
# projects, and Go modules from smarter-sh manifests and release workflows.
# It compares each latest stable registry version with the latest stable
# GitHub release, then tests npm/PyPI installs or downloads the Go module.
# Findings go to #general; package scripts are disabled during npm installs.
#
# The logic is in scripts/organization_health.py, whose tests are in scripts/tests.
#
# Secrets:
#   ORG_AUDIT_TOKEN  a GitHub token with repository contents and organization
#                    metadata read access. Its owner must be able to read every
#                    organization's repository.
#   SLACK_BOT_TOKEN  optional: chat:write.public, or the bot must be a member
#                    of #general. Without it, nothing is posted.
#------------------------------------------------------------------------------
name: Published Package Health Check

on:
  schedule:
    - cron: "57 1 * * 4" # Wednesday 19:57 CST / 20:57 CDT
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Check and report counts only; post nothing to Slack."
        required: false
        type: boolean
        default: false

concurrency:
  group: package-health-check
  cancel-in-progress: false

permissions:
  contents: read

env:
  DRY_RUN: ${{ inputs.dry-run && 'true' || 'false' }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.0"

      - name: Check published package health
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ORG_AUDIT_TOKEN }}
        run: |
          python3 -E -s scripts/organization_health.py run packages \
            --results "$RUNNER_TEMP/results.json"

      - name: Summarize findings
        if: always()
        shell: bash
        run: |
          python3 -E -s scripts/organization_health.py report \
            --results "$RUNNER_TEMP/results.json" --run-url "$RUN_URL" \
            --summary "$GITHUB_STEP_SUMMARY" --slack-output "$RUNNER_TEMP/slack.txt"

      - name: Post findings to Slack
        if: always() && env.DRY_RUN != 'true'
        continue-on-error: true
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python3 -I scripts/slack_post.py --channel general < "$RUNNER_TEMP/slack.txt"
