---
#------------------------------------------------------------------------------
# Secrets Age Review.
#
# Every Friday, checks organization, repository, and environment Actions
# secrets in every smarter-sh repository. It reports names and last-updated
# dates for secrets older than the configurable threshold to #general. Secret
# values are never read, and the public workflow summary contains counts only.
#
# The logic is in scripts/secret_age_review.py, whose tests are in scripts/tests.
#
# Secrets:
#   ORG_AUDIT_TOKEN    GitHub token with read access to organization secrets,
#                     Actions secrets, and repository metadata across the
#                     organization. Its owner needs admin access to each
#                     repository. A classic PAT needs admin:org and repo.
#   SLACK_BOT_TOKEN    optional: chat:write.public, or the bot must be a member
#                     of #general. Without it, nothing is posted.
#------------------------------------------------------------------------------
name: Secrets Age Review

on:
  schedule:
    - cron: "57 13 * * 5" # weekly, Friday 13:57 UTC
  workflow_dispatch:
    inputs:
      months:
        description: "Positive whole number of months without an update; defaults to 6."
        required: false
        type: number
        default: 6
      dry-run:
        description: "Check and report counts only; post nothing to Slack."
        required: false
        type: boolean
        default: false

concurrency:
  group: secrets-age-review
  cancel-in-progress: false

permissions:
  contents: read

env:
  DRY_RUN: ${{ inputs.dry-run && 'true' || 'false' }}
  MONTHS: ${{ inputs.months }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Review every organization's secret metadata
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ORG_AUDIT_TOKEN }}
        run: |
          python3 -E -s scripts/secret_age_review.py run \
            --months "${MONTHS:-6}" \
            --results "$RUNNER_TEMP/results.json"

      - name: Summarize findings
        if: always()
        shell: bash
        run: |
          args=(--results "$RUNNER_TEMP/results.json" --run-url "$RUN_URL" \
            --summary "$GITHUB_STEP_SUMMARY" --slack-output "$RUNNER_TEMP/slack.txt")
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          python3 -E -s scripts/secret_age_review.py report "${args[@]}"

      - name: Post detailed findings to Slack
        if: always() && env.DRY_RUN != 'true'
        continue-on-error: true
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python3 -I scripts/slack_post.py --channel general < "$RUNNER_TEMP/slack.txt"
